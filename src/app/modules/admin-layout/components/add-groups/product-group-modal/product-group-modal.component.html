<div
  class="modal fade"
  id="productGroupModal"
  tabindex="-1"
  aria-labelledby="productGroupModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1
          class="modal-title fs-5 fw-bold"
          id="productGroupModalLabel"
          [ngStyle]="{
            color: alertMsg.includes('Deactivated') ? 'red' : 'green'
          }"
          [ngStyle]="{ color: alertMsg.includes('No') ? 'red' : 'green' }"
        >
          {{ alertTitle }}
        </h1>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <p
          class="fs-5 fw-bolder"
          [ngStyle]="{
            color: alertMsg.includes('Deactivated') ? 'red' : 'green'
          }"
          [ngStyle]="{ color: alertMsg.includes('No') ? 'red' : 'green' }"
        >
          {{ alertMsg }}
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">
          OK
        </button>
      </div>
    </div>
  </div>
</div>
