<!-- approval grid  -->
<div class="container-responsive approval-grid">
  <app-dashboard-menu-header
    title="Add Product Table"
  ></app-dashboard-menu-header>

  <app-status-button
    [btnIndex]="btnIndex"
    (getProductsEvent)="getProducts($event)"
    (openAddProductModalEvent)="openAddProductModal()"
    [addGroupModalCenter]="'#addProductModalCenter'"
    [NewButton]="'New'"
    [ActiveButton]="'Active'"
    [InactiveButton]="'Inactive'"
    [AddButtonName]="'Add Product'"
    [addBtnIndex]="addBtnIndex"
  ></app-status-button>

  <div class="scrollable-table border border-1 bg-light">
    <!-- TABLE header -->
    <div class="row headerRow sticky-top fw-bolder">
      <div *ngIf="btnIndex!=-1" class="col tableHeader">
        <input
          type="checkbox"
          [(ngModel)]="selectAll"
          (ngModelChange)="toggleAllCheckboxes()"
          #allselected
        />
        Select All
      </div>

      <ng-container *ngFor="let header of headers">
        <div class="col tableHeader">{{ header }}</div>
      </ng-container>
      <div class="col tableHeader" *ngIf="btnIndex != -1">Actions</div>
    </div>
    <div>
      <h1
        *ngIf="productList?.length == 0"
        class="text-center"
        style="color: red; margin-top: 15%"
      >
        Product Not Found
      </h1>
    </div>
    <!-- table body -->

    <section
      class="row tablebodyRow fw-semibold"
      *ngFor="let product of productList; let i = index"
      (mouseover)="isHovered = i"
      (mouseout)="isHovered = null"
      (dblclick)="openModalWithData(product)"
    >
      <app-product-grid-view
        [product]="product"
        [activeProductId]="activeProductId"
        [isHovered]="isHovered"
        [i]="i"
        [btnIndex]="btnIndex"
        (checkboxSelectedEvent)="checkboxSelected($event)"
        (updateIsActiveEvent)="updateIsActive($event)"
      ></app-product-grid-view>
    </section>
  </div>
  <div class="d-flex justify-content-end">
    <button
      *ngIf="btnIndex === 0 "
      class="custom-btn"
      (click)="chageActiveInactive(true)"
    >
      Active
    </button>
    <button
      *ngIf="btnIndex === 1 "
      class="custom-btn"
      (click)="chageActiveInactive(false)"
    >
      Inactive
    </button>
  </div>
</div>

<!-- add Product modal   -->
<div *ngIf="btnClick">
  <app-add-products-modal
    [IdName]="'#addProductModalCenter'"
    [isEdit]="isEditMode"
    [doubleClickData]="doubleClickData"
    (resetFormEvent)="resetForm()"
    (formDataEvent)="onSubmit($event)"
    [addBtnClick]="addbtnClickP"
    [productGroups]="productGroups"
    [brands]="brands"
    [units]="units"
  ></app-add-products-modal>
</div>

<!-- Button trigger modal -->
<button
  type="button"
  class="btn btn-primary d-none"
  data-bs-toggle="modal"
  data-bs-target="#prodExistModal"
  #prdouctExistModalBTN
>
  Launch demo modal
</button>

<button
  type="button"
  class="btn btn-primary d-none"
  data-bs-toggle="modal"
  data-bs-target="#addProductModalCenter"
  #addProductModalCenterG
>
  Launch demo modal
</button>
<!-- Modal -->

<app-dynamic-alert-modal
  [alertMsg]="alertMsg"
  [alertTitle]="alertTitle"
  [id]="'prodExistModal'"
></app-dynamic-alert-modal>
