<!-- approval grid  -->
<div class="container-responsive approval-grid">
  <app-dashboard-menu-header
    title="Add Product Table"
  ></app-dashboard-menu-header>

  <app-status-button
    [btnIndex]="btnIndex"
    (getProductsEvent)="getProducts($event)"
    [addGroupModalCenter]="'#addProductModalCenter'"
    [NewButton]="'New'"
    [ActiveButton]="'Active'"
    [InactiveButton]="'Inactive'"
    [AddButtonName]="'Add Product'"
  ></app-status-button>

  <div class="scrollable-table border border-1 bg-light">
    <!-- TABLE header -->
    <div class="row headerRow sticky-top fw-bolder">
      <div class="col tableHeader">
        <input
          type="checkbox"
          [(ngModel)]="selectAll"
          (ngModelChange)="toggleAllCheckboxes()"
          #allselected
        />
        Select All
      </div>

      <ng-container *ngFor="let header of headers">
        <div class="col tableHeader">{{ header }}</div>
      </ng-container>
      <div class="col tableHeader" *ngIf="btnIndex != -1">Actions</div>
    </div>
    <div>
      <h1
        *ngIf="productList?.length == 0"
        class="text-center"
        style="color: red; margin-top: 15%"
      >
        Product Not Found
      </h1>
    </div>
    <!-- table body -->

    <section
      class="row tablebodyRow fw-semibold"
      *ngFor="let product of productList; let i = index"
      (mouseover)="isHovered = i"
      (mouseout)="isHovered = null"
      (dblclick)="openModalWithData(product)"
    >
      <app-product-grid-view
        [product]="product"
        [activeProductId]="activeProductId"
        [isHovered]="isHovered"
        [i]="i"
        [btnIndex]="btnIndex"
        (checkboxSelectedEvent)="checkboxSelected($event)"
        (updateIsActiveEvent)="updateIsActive($event)"
      ></app-product-grid-view>
    </section>
  </div>
  <div class="d-flex justify-content-end">
    <button
      *ngIf="btnIndex === 0 || btnIndex === -1"
      class="custom-btn"
      (click)="chageActiveInactive(1)"
    >
      Active
    </button>
    <button
      *ngIf="btnIndex === 1 || btnIndex === -1"
      class="custom-btn"
      (click)="chageActiveInactive(0)"
    >
      Inactive
    </button>
  </div>
</div>

<!-- add Product modal   -->
<div
  class="modal fade"
  id="addProductModalCenter"
  tabindex="-1"
  aria-labelledby="exampleModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-body">
        <div class="d-flex justify-content-end align-items-center">
          <button
            type="button"
            class="btn-close border border-1"
            data-bs-dismiss="modal"
            aria-label="Close"
            (click)="resetForm()"
          ></button>
        </div>
        <!-- add product form design -->
        <div>
          <div class="d-flex justify-content-center align-items-center">
            <!-- Title in the middle -->
            <!-- <h2 class="register_title">Add Product</h2> -->
            <h2 class="register_title">
              {{ isEditMode ? "Edit Product" : "Add Product" }}
            </h2>

            <!-- Placeholder for right alignment -->
            <!-- <div></div> -->
          </div>

          <hr />
          <form [formGroup]="addProductForm">
            <div class="form-group">
              <label for="productGroupID"
                ><span class="text-danger">*</span>Product Group Name</label
              >
              <select
                id="productGroupID"
                formControlName="productGroupID"
                [class.error]="isFieldInvalid('productGroupID')"
              >
                <option value="" disabled>Select Product Group</option>
                <option
                  *ngFor="let group of productGroups"
                  [value]="group.productGroupID"
                >
                  {{ group.productGroupName }}
                </option>
              </select>
              <span class="text-danger" *ngIf="isFieldInvalid('productGroupID')"
                >Product Group Name is required.</span
              >
            </div>

            <div class="form-group">
              <label for="productName"
                ><span class="text-danger">*</span>Product Name</label
              >
              <input
                type="text"
                id="productName"
                formControlName="productName"
                [class.error]="isFieldInvalid('productName')"
              />
              <span class="text-danger" *ngIf="isFieldInvalid('productName')"
                >Product Name is required.</span
              >
            </div>

            <div class="form-group">
              <label for="productSubName -"> Product SubName </label>
              <input
                type="text"
                id="productSubName"
                formControlName="productSubName"
              />
            </div>

            <div class="form-group">
              <label for="specification"
                ><span class="text-danger">*</span>Specification
              </label>
              <textarea
                type="text"
                id="specification"
                class="textAreaDesign"
                formControlName="specification"
                [class.error]="isFieldInvalid('specification')"
              ></textarea>

              <span class="text-danger" *ngIf="isFieldInvalid('specification')"
                >Specification is required.</span
              >
            </div>

            <div class="form-group">
              <label for="brandId"
                ><span class="text-danger">*</span>Brand</label
              >

              <select
                name="brandId"
                id="brandId"
                formControlName="brandId"
                [class.error]="isFieldInvalid('brandId')"
              >
                <option value="" disabled>Select Brand</option>
                <option *ngFor="let brand of brands" [value]="brand.brandId">
                  {{ brand.brandName }}
                </option>
              </select>

              <span class="text-danger" *ngIf="isFieldInvalid('brandId')"
                >brandId is required.</span
              >
            </div>

            <div class="form-group">
              <label for="unitId"><span class="text-danger">*</span>Unit</label>

              <select
                name="unitId"
                id="unitId"
                formControlName="unitId"
                [class.error]="isFieldInvalid('unitId')"
              >
                <option value="" disabled>Select Unit</option>
                <option *ngFor="let unit of units" [value]="unit.unitId">
                  {{ unit.name }}
                </option>
              </select>

              <span class="text-danger" *ngIf="isFieldInvalid('unitId')"
                >unitId is required.</span
              >
            </div>

            <div *ngIf="isEditMode" class="image-preview">
              <label> Product Image Preview </label>
              <img
                [src]="imagePathPreview"
                alt="Product Image"
                class="product_image"
              />
            </div>

            <div class="form-group">
              <label
                ><span class="text-danger">*</span>Upload Product Image
              </label>

              <input
                type="file"
                class="form-control"
                id="productImage"
                formControlName="productImage"
                accept="image/jpeg, image/jpg, image/png, image/webp"
                [class.error]="isFieldInvalid('productImage')"
                #ProductImageInput
              />
              <span class="text-danger" *ngIf="isFieldInvalid('productImage')"
                >Product Image is required.</span
              >
            </div>

            <button
              type="submit"
              class="button mt-3"
              id="sign-in-button"
              (click)="onSubmit()"
            >
              Submit
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Button trigger modal -->
<button
  type="button"
  class="btn btn-primary d-none"
  data-bs-toggle="modal"
  data-bs-target="#prodExistModal"
  #prdouctExistModalBTN
>
  Launch demo modal
</button>

<button
  type="button"
  class="btn btn-primary d-none"
  data-bs-toggle="modal"
  data-bs-target="#addProductModalCenter"
  #addProductModalCenterG
>
  Launch demo modal
</button>
<!-- Modal -->

<app-dynamic-alert-modal
  [alertMsg]="alertMsg"
  [alertTitle]="alertTitle"
  [id]="'prodExistModal'"
></app-dynamic-alert-modal>
