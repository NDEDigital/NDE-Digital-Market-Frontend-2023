<!-- approval grid  -->
<div class="container-responsive approval-grid">
  <app-dashboard-menu-header title="Add Unit Table"></app-dashboard-menu-header>

  <app-status-button
    [btnIndex]="btnIndex"
    (getProductsEvent)="getProductGroup($event)"
    [addGroupModalCenter]="'#addGroupModalCenter'"
    [NewButton]="'New'"
    [ActiveButton]="'Active'"
    [InactiveButton]="'Inactive'"
    [AddButtonName]="'Add Unit'"
  ></app-status-button>
  <div class="scrollable-table border border-1 bg-light">
    <!-- TABLE header -->
    <div class="row headerRow sticky-top fw-bolder">
      <div class="col tableHeader">
        <input
          type="checkbox"
          [(ngModel)]="selectAll"
          (ngModelChange)="toggleAllCheckboxes()"
          #allselected
        />
        Select All
      </div>
      <ng-container *ngFor="let header of headers">
        <div class="col tableHeader">{{ header }}</div>
      </ng-container>
      <div class="col tableHeader" *ngIf="btnIndex != -1">Actions</div>
    </div>
    <div>
      <h1
        *ngIf="groupList && groupList.length == 0"
        class="text-center"
        style="color: red; margin-top: 15%"
      >
        Unit Not Found
      </h1>
    </div>
    <!-- table body -->

    <section
      class="row tablebodyRow fw-semibold"
      *ngFor="let unit of groupList; let i = index"
      (mouseover)="isHovered = i"
      (mouseout)="isHovered = null"
      (dblclick)="openModalWithData(unit)"
    >
      <app-unit-list-grid-view
        [unit]="unit"
        [i]="i"
        [isHovered]="isHovered"
        [btnIndex]="btnIndex"
        (checkboxSelectedEvent)="checkboxSelected($event)"
        (updateIsActiveEvent)="updateIsActive($event.status, $event.unitIds)"
      ></app-unit-list-grid-view>
    </section>
  </div>
  <div class="d-flex justify-content-end">
    <button
      *ngIf="btnIndex === 0 || btnIndex === -1"
      class="custom-btn"
      (click)="chageActiveInactive(true)"
    >
      Active
    </button>
    <button
      *ngIf="btnIndex === 1 || btnIndex === -1"
      class="custom-btn"
      (click)="chageActiveInactive(false)"
    >
      Inactive
    </button>
  </div>
</div>

<!-- add Group modal   -->
<div
  class="modal fade"
  id="addGroupModalCenter"
  tabindex="-1"
  aria-labelledby="exampleModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-body">
        <div class="d-flex justify-content-end align-items-center">
          <button
            type="button"
            class="btn-close border border-1"
            data-bs-dismiss="modal"
            aria-label="Close"
            (click)="resetForm()"
          ></button>
        </div>
        <!-- add group form design  -->
        <div>
          <!-- <h2 class="register_title">Add Product Groups Name</h2> -->
          <div class="d-flex justify-content-center align-items-center">
            <!-- Back Button on the left -->

            <!-- Title in the middle -->
            <h2 class="register_title">
              {{ isEditMode ? "Edit Unit Name" : "Add Unit Name" }}
            </h2>
          </div>
          <hr />
          <form [formGroup]="addGroupForm">
            <div class="form-group">
              <label for="description"
                ><span class="text-danger">*</span>Product Unit Name</label
              >
              <input
                type="text"
                id="description"
                formControlName="description"
                [class.error]="isFieldInvalid('description')"
              />
              <span class="text-danger" *ngIf="isFieldInvalid('description')"
                >Product Unit Name is required.</span
              >
            </div>

            <div class="form-group">
              <label for="name"
                ><span class="text-danger">*</span>Product Unit Symbol</label
              >
              <input
                type="text"
                id="name"
                formControlName="name"
                [class.error]="isFieldInvalid('name')"
              />
              <span class="text-danger" *ngIf="isFieldInvalid('name')"
                >Product Unit Symbol is required.</span
              >
            </div>
            <!-- Button trigger modal -->
            <button
              type="submit"
              class="button mt-3"
              id="sign-in-button"
              (click)="onSubmit()"
            >
              Submit
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<button
  type="button"
  class="btn btn-primary d-none"
  data-bs-toggle="modal"
  data-bs-target="#productGroupModal"
  #userExistModalBTN
>
  Launch demo modal
</button>
<button
  type="button"
  class="btn btn-primary d-none"
  data-bs-toggle="modal"
  data-bs-target="#addGroupModalCenter"
  #addGroupModalCenterG
>
  Launch demo modal
</button>
<!-- Modal -->
<app-dynamic-alert-modal
  [alertMsg]="alertMsg"
  [alertTitle]="alertTitle"
  [id]="'productGroupModal'"
></app-dynamic-alert-modal>
