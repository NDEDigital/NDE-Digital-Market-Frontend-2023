<div class="table-body-data">
  <div
    class="col tableBody"
    [ngClass]="{
      'active-row': isHovered === i
    }"
  >
    #{{ i + 1 }}
  </div>

  <div
    class="col tableBody"
    [ngClass]="{
      'active-row': isHovered === i
    }"
  >
    <ng-container *ngIf="banner.isAds === true">
      <span>Advertise</span>
    </ng-container>

    <ng-container *ngIf="banner.isAds === false">
      <span>Banner</span>
    </ng-container>
  </div>

  <div
    class="col tableBody"
    [ngClass]="{
      'active-row': isHovered === i
    }"
  >
    <img
      [src]="
        banner.bannerImage
          ? '/asset' + banner.bannerImage?.split('asset')[1]
          : ''
      "
      class="product_image"
      alt="Banner Image"
    />
  </div>

  <div
    class="col tableBody"
    [ngClass]="{
      'active-row': isHovered === i
    }"
  >
    <p class="description">{{ banner.bannerDescription }}</p>
  </div>
  <div
    class="col tableBody"
    [ngClass]="{
      'active-row': isHovered === i
    }"
  >
    {{ banner.addedDate | date : "dd MMM yyyy" }}
  </div>

  <div
    class="col tableBody"
    [ngClass]="{
      'active-row': isHovered === i
    }"
  >
    <ng-container *ngIf="banner.isBannerStatus === null">
      <span [style.color]="'#0047AB'">Pending</span>
    </ng-container>
    <ng-container
      *ngIf="banner.isBannerStatus === true && banner.isActive == true"
    >
      <span [style.color]="'green'">Approved</span>
    </ng-container>
    <ng-container
      *ngIf="banner.isBannerStatus == false && banner.isActive == false"
    >
      <span [style.color]="'	#E49B0F'">Expired</span>
    </ng-container>

    <ng-container
      *ngIf="banner.isBannerStatus == true && banner.isActive == false"
    >
      <span [style.color]="'red'">Rejected</span>
    </ng-container>
  </div>
</div>
