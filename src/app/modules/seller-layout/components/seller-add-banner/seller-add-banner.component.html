<!-- approval grid  -->
<div class="container-responsive body-design">
  <div
    class="bg-white same-width d-flex justify-content-center p-2 border border-1 rounded"
  >
    <div class="d-flex justify-content-center">
      <h1 class="companyApproval_header_text">Add Banner</h1>
    </div>
  </div>
  <app-status-button
    [AddButtonName]="'Add Banner'"
    [addGroupModalCenter]="'#addGroupModalCenter'"
    [btnIndex]="'2'"
  ></app-status-button>
</div>

<div
  class="modal fade"
  *ngFor="let banner of banners; let i = index"
  id="addGroupModalCenter"
  tabindex="-1"
  aria-labelledby="exampleModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-body">
        <div class="d-flex justify-content-end align-items-center">
          <button
            type="button"
            class="btn-close border border-1"
            data-bs-dismiss="modal"
            aria-label="Close"
            (click)="closeEditFormWithoutUpdate()"
          ></button>
        </div>
        <!-- Title -->
        <div class="d-flex justify-content-center align-items-center">
          <h2 class="register_title">
            {{
              isEditMode
                ? "Edit Banner / Advertisement"
                : "Add Banner / Advertisement"
            }}
          </h2>
        </div>
        <hr />

        <div class="checkbox-container">
          <input
            type="checkbox"
            id="bannerCheckbox"
            name="bannerCheckbox"
            (change)="adsFalse()"
            [checked]="!isAds"
            class="checkbox-input"
          />
          <label for="bannerCheckbox" class="checkbox-label">Banner</label>
          <input
            type="checkbox"
            id="adsCheckbox"
            name="adsCheckbox"
            (change)="adsTrue()"
            [checked]="isAds"
            class="checkbox-input"
          />
          <label for="adsCheckbox" class="checkbox-label">Ads</label>
        </div>

        <!-- Banner Form -->
        <form [formGroup]="addBannerForm">
          <div class="form-group">
            <label><span class="text-danger">*</span>Upload Banner Image</label>
            <input
              type="file"
              class="form-control"
              id="bannerImage"
              formControlName="bannerImage"
              #ProductImageInput
              [attr.required]="!isEditMode ? true : null"
            />
            <span class="text-danger" *ngIf="isFieldInvalid('bannerImage')"
              >Banner Image is required.</span
            >
          </div>
          <!-- Image preview -->
          <div class="form-group" *ngIf="isEditMode && imagePathPreview">
            <img
              [src]="
                imagePathPreview.substring(imagePathPreview.indexOf('assets'))
              "
              alt="Current Image"
              class="img-preview"
            />
          </div>
          <!-- Description field -->
          <div class="form-group">
            <label><span class="text-danger">*</span>Description</label>
            <textarea
              formControlName="bannerDescription"
              class="w-100 p-1 rounded-1 border border-1 large-textarea"
              [attr.required]="!isEditMode ? true : null"
            ></textarea>
            <span
              class="text-danger"
              *ngIf="isFieldInvalid('bannerDescription')"
              >Description is required.</span
            >
          </div>

          <button
            type="submit"
            class="button mt-3"
            id="sign-in-button"
            (click)="onSubmit()"
          >
            {{ isEditMode ? "Update" : "Submit" }}
          </button>


        </form>
      </div>
    </div>
  </div>
</div>

<div class="scrollable-table border border-1 bg-light">
  <!-- TABLE header -->
  <div class="row headerRow sticky-top fw-bolder">
    <div class="col tableHeader">Index</div>
    <!-- <div class="col tableHeader">Product Group ID</div> -->
    <div class="col tableHeader">Type</div>
    <div class="col tableHeader">Image</div>

    <div class="col tableHeader">Description</div>

    <div class="col tableHeader">Date Added</div>
    <div class="col tableHeader">Status</div>

    <!-- 
      <div class="col tableHeader" >Actions</div> -->
  </div>

  <!-- table body -->

  <section
    class="row tablebodyRow fw-semibold"
    *ngFor="let banner of banners; let i = index"
    (dblclick)="
      !(isApproved(banner) || isExpired(banner)) && openEditForm(banner)
    "
    (mouseover)="isHovered = i"
    (mouseout)="isHovered = null"
  >
    <app-seller-add-banner-grid-view
      [banner]="banner"
      [isHovered]="isHovered"
      [i]="i"
    ></app-seller-add-banner-grid-view>
  </section>
</div>

<!-- Button trigger modal -->
<!-- Modal -->
<button
  type="button"
  class="btn btn-primary d-none"
  data-bs-toggle="modal"
  data-bs-target="#productGroupModal"
  #prdouctExistModalBTN
>
  Launch demo modal
</button>
<button
  type="button"
  class="btn btn-primary d-none"
  data-bs-toggle="modal"
  data-bs-target="#addGroupModalCenter"
  #addGroupModalCenterG
>
  Launch demo modal
</button>
<!-- Dynamic Alert Modal -->
<app-dynamic-alert-modal
  [alertMsg]="alertMsg"
  [alertTitle]="'Successful'"
  [id]="'productGroupModal'"
></app-dynamic-alert-modal>
