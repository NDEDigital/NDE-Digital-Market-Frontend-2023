<!-- approval grid  -->
<div class="container approval-grid">
  <app-dashboard-menu-header
    title="Add Brands Table"
  ></app-dashboard-menu-header>
  <div
    class="mt-2 bg-light border border-1 px-3 py-2 rounded my-2 d-flex justify-content-between"
  >
    <div class="headerbtns">
      <button
        class="custom-btn new-btn"
        (click)="getNewBrands(-1); btnIndex = -1"
        [ngClass]="{ active: btnIndex === -1 }"
      >
        New
      </button>
      <button
        class="custom-btn btn-active"
        (click)="getNewBrands(true)"
        [ngClass]="{ active: btnIndex === 1 }"
        (click)="btnIndex = 1"
      >
        Active
      </button>
      <button
        class="custom-btn btn-inactive"
        (click)="getNewBrands(false)"
        [ngClass]="{ active: btnIndex === 0 }"
        (click)="btnIndex = 0"
      >
        Inactive
      </button>
    </div>

    <div>
      <button
        class="custom-btn addGroup-btn"
        data-bs-toggle="modal"
        data-bs-target="#addGroupModalCenter"
        #addGroupModalCenterG
      >
        Add Brand
      </button>
    </div>
  </div>
  <div class="scrollable-table border border-1 bg-light">
    <!-- TABLE header -->
    <div class="row headerRow sticky-top fw-bolder">
      <div class="col tableHeader">
        <input
          type="checkbox"
          [(ngModel)]="selectAll"
          (ngModelChange)="toggleAllCheckboxes()"
          #allselected
        />
        Select All
      </div>
      <div class="col tableHeader">Index</div>
      <!-- <div class="col tableHeader">Product Group ID</div> -->
      <div class="col tableHeader">Brands Name</div>
      <div class="col tableHeader">Short Name</div>
      <div class="col tableHeader">Description</div>
      <div class="col tableHeader" *ngIf="btnIndex != -1">Actions</div>
    </div>
    <div>
      <h1
        *ngIf="groupList && groupList.length == 0"
        class="text-center"
        style="color: red; margin-top: 15%"
      >
        Brands Not Found
      </h1>
    </div>
    <!-- table body -->

    <section
      class="row tablebodyRow fw-semibold"
      *ngFor="let group of groupList; let i = index"
      (mouseover)="isHovered = i"
      (mouseout)="isHovered = null"
      (dblclick)="openModalWithData(group)"
    >
      <div
        class="col tableBody"
        [ngClass]="{
          'active-row': isHovered === i
        }"
      >
        <input
          type="checkbox"
          [(ngModel)]="group.isSelected"
          (change)="checkboxSelected(group.brandId, $event)"
        />
      </div>
      <div
        class="col tableBody"
        [ngClass]="{
          'active-row': group.unitId === activeGroupId || isHovered === i
        }"
      >
        #{{ i + 1 }}
      </div>
      <!-- <div
              class="col tableBody"
              [ngClass]="{ 'active-row': group.productGroupID === activeGroupId }"
            >
              {{ group.productGroupID }}
            </div> -->
      <div
        class="col tableBody"
        [ngClass]="{
          'active-row': group.brandId === activeGroupId || isHovered === i
        }"
      >
        {{ group.brandName }}
      </div>
      <div
        class="col tableBody"
        [ngClass]="{
          'active-row': group.brandId === activeGroupId || isHovered === i
        }"
      >
        {{ group.shortName }}
      </div>
      <div
        class="col tableBody"
        [ngClass]="{
          'active-row': group.brandId === activeGroupId || isHovered === i
        }"
      >
        {{ group.description }}
      </div>

      <div
        class="col tableBody"
        *ngIf="btnIndex != -1"
        [ngClass]="{ 'active-row': isHovered === i }"
      >
        <div class="d-flex justify-content-center align-items-center">
          <div>
            <button
              class="actionBtn"
              *ngIf="btnIndex === 0"
              (click)="updateIsActive(true, group.brandId)"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="30"
                height="30"
                fill="green"
                class="bi bi-check2 me-3"
                viewBox="0 0 16 16"
              >
                <path
                  d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"
                />
              </svg>
            </button>
          </div>
          <div>
            <button
              class="actionBtn"
              *ngIf="btnIndex === 1"
              (click)="updateIsActive(false, group.brandId)"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="25"
                height="25"
                fill="red"
                class="bi bi-x-lg fw-bolder"
                viewBox="0 0 16 16"
              >
                <path
                  d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </section>
  </div>
  <div class="d-flex justify-content-end">
    <button
      *ngIf="btnIndex === 0 || btnIndex === -1"
      class="custom-btn"
      (click)="chageActiveInactive(true)"
    >
      Active
    </button>
    <button
      *ngIf="btnIndex === 1 || btnIndex === -1"
      class="custom-btn"
      (click)="chageActiveInactive(false)"
    >
      Inactive
    </button>
  </div>
</div>

<!-- add Group modal   -->
<div
  class="modal fade"
  id="addGroupModalCenter"
  tabindex="-1"
  aria-labelledby="exampleModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-body">
        <div class="d-flex justify-content-end align-items-center">
          <button
            type="button"
            class="btn-close border border-1"
            data-bs-dismiss="modal"
            aria-label="Close"
            (click)="resetForm()"
          ></button>
        </div>
        <!-- add group form design  -->
        <div>
          <!-- <h2 class="register_title">Add Product Groups Name</h2> -->
          <div class="d-flex justify-content-center align-items-center">
            <!-- Back Button on the left -->

            <!-- Title in the middle -->
            <h2 class="register_title">
              {{ isEditMode ? "Edit Brand Name" : "Add Brand Name" }}
            </h2>
          </div>
          <hr />
          <form [formGroup]="addGroupForm">
            <div class="form-group">
              <label for="brandName"
                ><span class="text-danger">*</span>Brand Name</label
              >
              <input
                type="text"
                id="brandName"
                formControlName="brandName"
                [class.error]="isFieldInvalid('brandName')"
              />
              <span class="text-danger" *ngIf="isFieldInvalid('brandName')"
                >Brand Name is required.</span
              >
            </div>

            <div class="form-group">
              <label for="shortName">Brand Short Name</label>
              <input type="text" id="shortName" formControlName="shortName" />
            </div>

            <div class="form-group">
              <label for="description">Description</label>
              <textarea
                id="description"
                formControlName="description"
              ></textarea>
            </div>

            <!-- Button trigger modal -->
            <button
              type="submit"
              class="button mt-3"
              id="sign-in-button"
              (click)="onSubmit()"
            >
              Submit
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<button
  type="button"
  class="btn btn-primary d-none"
  data-bs-toggle="modal"
  data-bs-target="#productGroupModal"
  #userExistModalBTN
>
  Launch demo modal
</button>
<!-- Modal -->
<div
  class="modal fade"
  id="productGroupModal"
  tabindex="-1"
  aria-labelledby="productGroupModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1
          class="modal-title fs-5"
          id="productGroupModalLabel"
          [ngStyle]="{
            color: alertMsg.includes('Deactivated') ? 'red' : 'green'
          }"
          [ngStyle]="{ color: alertMsg.includes('No') ? 'red' : 'green' }"
        >
          {{ alertTitle }}
        </h1>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <p
          class="fs-5 fw-bolder"
          [ngStyle]="{
            color: alertMsg.includes('Deactivated') ? 'red' : 'green'
          }"
          [ngStyle]="{ color: alertMsg.includes('No') ? 'red' : 'green' }"
        >
          {{ alertMsg }}
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">
          OK
        </button>
      </div>
    </div>
  </div>
</div>
