  <!-- <div class="w-auto nav-line"></div> -->

  <div *ngIf="loading" class="text-center mt-5">
    <h5>Loading products...</h5>
  </div>
  <div *ngIf="!loading && wishList.length < 1">
    <h3 class="text-danger text-center mt-5">No Product Found</h3>
  </div>

  <div *ngFor="let wish of wishList" class="border mt-4">
    <div class="row mt-4" id="wishDiv">
      <div
        class="col-2 d-flex justify-content-center"
        (click)="goToDetail(wish)"
      >
        <img
          [src]="
            wish.imagePath ? '/asset' + wish.imagePath?.split('asset')[1] : ''
          "
          class="w-50 h-75"
          alt=""
        />
      </div>
      <div class="col-1" (click)="goToDetail(wish)">
        {{ wish.goodsName }}
      </div>
      <div class="col-1 col-sm-2">
        <span class="qty-design">Qty: {{ wish.approveSalesQty }}</span>
      </div>
      <div class="col-1 col-sm-2 ml-2">
        <span class="color-primary">Price: {{ wish.price }}</span>
      </div>
      <div *ngIf="wish.approveSalesQty > 0" class="col-1 col-sm-2 ml-2">
        <button
          class="btn btn-success"
          data-bs-toggle="modal"
          data-bs-target="#exampleModal"
          (click)="setCart(wish, '1')"
        >
          {{ CartButtonText }}
        </button>
      </div>
    </div>
  </div>
  
  <!-- Modal for cart-->
  <div
    #exampleModal
    class="modal fade"
    id="exampleModal"
    tabindex="-1"
    aria-labelledby="exampleModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <!-- <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1> -->
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <p class="h4">
            ({{ popUpCount }}) new item(s) have been added to your cart
          </p>
        </div>
        <div class="modal-footer">
          <!-- <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button> -->
          <button
            routerLink="/cartView"
            type="button"
            data-bs-dismiss="modal"
            class="btn btn-warning"
          >
            GO TO CART
          </button>
        </div>
      </div>
    </div>
  </div>
  
</section>
<div id="footer" class="footer-responsive">
  <app-footer></app-footer>
</div>
