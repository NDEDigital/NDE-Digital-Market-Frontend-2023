<div class="side">
  <p class="parent">Categories</p>
  <div *ngFor="let entry of groupData | keyvalue; let i = index">
    <div *ngIf="showAll || i < initialLimit" class="radio-container">
      <input
        class="form-check-input"
        type="radio"
        name="flexRadioDefault"
        id="checkbox-{{ i }}"
        style="cursor: pointer"
        (click)="setSelectData(entry.key, entry.value)"
        (click)="filterProductsByCategory(groupName)"
        [ngClass]="{ selected: entry.value === activeEntry }"
        [checked]="entry.value === activeEntry"

      />
      <label
        for="checkbox-{{ i }}"
        class="radio-label"
        style="cursor: pointer"
        [ngClass]="{ bold: entry.value === activeEntry }"
        
      >
        {{ entry.value }}
      </label>
    </div>
  </div>

  <hr />

  <div *ngIf="!isProductPage">
    <p class="parent">Brands</p>
    <ul class="list-unstyled mb-3">
      <div *ngFor="let company of companyList; let i = index">
        <li *ngIf="showAllBrand || i < initialLimit">
          <input
            class="form-check-input"
            type="radio"
            name="flexRadioDefault"
            id="checkbox"
          />
          <label class="form-check-label" for="flexCheckDefault">{{
            company.companyName
          }}</label>
        </li>
      </div>
      <h5
        *ngIf="companyList && companyList.length > initialLimit"
        (click)="showAllBrand = !showAllBrand"
        class="text-primary"
        style="cursor: pointer"
      >
        {{ showAllBrand ? "Show Less" : "Show All" }}
      </h5>
    </ul>
    <hr />
  </div>
