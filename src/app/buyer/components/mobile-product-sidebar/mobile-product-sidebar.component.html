<div class="side">
  <div class="filter-data">
    <div class="filter-header">
      <p class="parent">Filter</p>

      <p
        *ngIf="clear"
        class="filter-clear"
        (click)="removeFilterContent('all')"
      >
        clear
      </p>
    </div>
    <div class="filterContent">
      <div
        *ngFor="let item of filterContent"
        class="filter-content-item"
        (click)="removeFilterContent(item)"
      >
        <p id="content-item">{{ item }}</p>
        <p>X</p>
      </div>
    </div>
  </div>
  <div *ngIf="showCategory1" class="filter-data">
    <div class="side-bar-title" (click)="toggleGroupVisibility()">
      <p class="parent">Categories</p>
      <img
        src="assets/images/down-arrow.svg"
        [style.transform]="showGroupValue ? 'rotate(0deg)' : 'rotate(180deg)'"
        [style.transition]="'transform 0.3s'"
      />
    </div>
    <div *ngIf="showGroupValue">
      <div *ngFor="let entry of groupData | keyvalue; let i = index">
        <div *ngIf="showAll || i < initialLimit" class="radio-container">
          <input
            class="form-check-input"
            type="radio"
            name="category"
            id="category-checkbox1-{{ i }}"
            style="cursor: pointer"
            (click)="setSelectData(entry.key, entry.value)"
            [ngClass]="{ selected: entry.key === activeEntry1 }"
            [checked]="entry.key === activeEntry1"
          />
          <label
            for="category-checkbox1-{{ i }}"
            class="radio-label"
            style="cursor: pointer"
            [ngClass]="{ bold: entry.key == activeEntry1 }"
          >
            {{ entry.value }}
          </label>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="showGroup1" class="filter-data">
    <div class="side-bar-title" (click)="toggleGroupVisibility()">
      <p class="parent">Categories</p>
      <img
        src="assets/images/down-arrow.svg"
        [style.transform]="showGroupValue ? 'rotate(0deg)' : 'rotate(180deg)'"
        [style.transition]="'transform 0.3s'"
      />
    </div>
    <div *ngIf="showGroupValue">
      <div *ngFor="let entry of groupData | keyvalue; let i = index">
        <div *ngIf="showAll || i < initialLimit" class="radio-container">
          <input
            class="form-check-input"
            type="radio"
            name="category"
            id="category-checkbox1-{{ i }}"
            style="cursor: pointer"
            (click)="setGroupData(entry.key, entry.value)"
            [ngClass]="{ selected: entry.key == activeEntry1 }"
            [checked]="entry.key == activeEntry1"
          />
          <label
            for="category-checkbox1-{{ i }}"
            class="radio-label"
            style="cursor: pointer"
            [ngClass]="{ bold: entry.value == activeEntry1 }"
          >
            {{ entry.value }}
          </label>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="showCompany1" class="filter-data">
    <div class="side-bar-title" (click)="toggleCompaniesVisibility()">
      <p class="parent">Companies</p>
      <img
        src="assets/images/down-arrow.svg"
        [style.transform]="
          showCompaniesValue ? 'rotate(0deg)' : 'rotate(180deg)'
        "
        [style.transition]="'transform 0.3s'"
      />
    </div>
    <div *ngIf="showCompaniesValue">
      <ul class="list-unstyled mb-3">
        <div *ngFor="let company of companyList; let j = index">
          <li *ngIf="showAllBrand || j < initialLimit">
            <input
              class="form-check-input"
              type="radio"
              name="brand"
              id="brand-checkbox1-{{ j }}"
              style="cursor: pointer"
              (click)="selectCompany(company.companyName, company.companyCode)"
              [ngClass]="{ selected: company.companyCode === activeCompany1 }"
              [checked]="company.companyCode === activeCompany1"
            />
            <label
              for="brand-checkbox1-{{ j }}"
              class="radio-label"
              style="cursor: pointer"
              [ngClass]="{ bold: company.companyCode === activeCompany1 }"
            >
              {{ company.companyName }}
            </label>
          </li>
        </div>
      </ul>
    </div>
  </div>
</div>
