<div class="d-flex flex-column align-items-center pb-2">
  <h6 class="offcanvas-title text-center" id="offcanvasScrollingLabel">
    Subtotal
  </h6>
  <h5 class="text-center">৳{{ cartTotalAmount }}</h5>
  <button
    class="btn border border-1 rounded-4 w-100 go-truck"
    routerLink="/cartView"
  >
    Go to CartList
  </button>
</div>

<div
  class="border-1 border-secondary border-bottom pb-2"
  *ngIf="cartData && cartData.length > 0"
>
  <div *ngFor="let entry of cartData">
    <div class="d-flex flex-row align-items-center">
      <div>
        <img
          class="cart-img"
          [src]="
            entry.imagePath
              ? entry.imagePath.substring(entry.imagePath.indexOf('assets'))
              : '../../../assets/images/medical/' +
                cartData.groupName.trim() +
                '.jpg'
          "
          alt=""
        />
      </div>
      <div class="d-flex flex-column my-1">
        <div class="product-name-container">
          <p class="product-name fw-bold my-1">
            {{
              entry.productName.length > 20
                ? (entry.productName | slice : 0 : 20) + "..."
                : entry.productName
            }}
          </p>
        </div>
        <p class="product-price fw-bold">
          <span class="money-icon">৳</span>{{ entry.price }}
        </p>
        <div class="product-quantitiy d-flex flex-row">
          <p class="fw-bold">X {{ entry.productCartQuantity }}</p>
          <svg
            (click)="deleteFromSideCart(entry)"
            class="delete-icon"
            xmlns="http://www.w3.org/2000/svg"
            fill="#d00404"
            height="1em"
            viewBox="0 0 448 512"
          >
            <path
              d="M135.2 17.7L128 32H32C14.3 32 0 46.3 0 64S14.3 96 32 96H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H320l-7.2-14.3C307.4 6.8 296.3 0 284.2 0H163.8c-12.1 0-23.2 6.8-28.6 17.7zM416 128H32L53.2 467c1.6 25.3 22.6 45 47.9 45H346.9c25.3 0 46.3-19.7 47.9-45L416 128z"
            />
          </svg>
        </div>
      </div>
    </div>
  </div>
</div>
