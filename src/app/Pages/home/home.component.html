<section id="page-container" class="container-responsive">
  <div id="content-wrap">
    <app-header></app-header>
    <app-nav-belt></app-nav-belt>
    <section class="mb-4"><app-banner></app-banner></section>
    <!-- <app-home-core-content></app-home-core-content> -->
    <div class="product-slider-wrapper">
      <div class="advertisement-left-responsive">
        <div
          class="card bg-dark text-white"
          *ngFor="let banner of bannerDetails; let i = index"
        >
          <p class="card-text">
            Advertisement
            <!-- (click)="hideBanner(i)" -->
            <span
              class="cls"
              *ngIf="!banner.hideClose"
              (click)="hideBannerAndShowReason(i)"
              ><i class="fas fa-times"></i
            ></span>
          </p>

          <img
            [src]="
              banner.bannerImage.substring(
                banner.bannerImage.indexOf('assets')
              ) || 'assets/images/banner/banner1.jpg'
            "
            class="card-img"
            [class.hidden]="banner.hidden"
            alt="Advertisement Image"
          />
          <div class="card-img-overlay">
            <p class="why" *ngIf="banner.showWhyThisAd">
              Why This Ad?
              <span
                class="reverse-icon-wrapper"
                (click)="toggleBannerVisibility(banner); showCloseIcon(i)"
                ><i class="fas fa-undo reverse-icon"></i
              ></span>
            </p>
          </div>
        </div>
      </div>
      <div class="product-slider">
        <app-product-slider></app-product-slider>
        <app-clients-list-slider [clients]="clients"></app-clients-list-slider>
      </div>
      <div class="advertisement-right-responsive">
        <!-- Right Advertisement Content Goes Here -->

        <div
          class="card bg-dark text-white"
          *ngFor="let banner of bannerDetails; let i = index"
        >
             <p class="card-text">
            Advertisement
            <!-- (click)="hideBanner(i)" -->
            <span
              class="cls"
              *ngIf="!banner.hideClose"
              (click)="hideBannerAndShowReason(i)"
              ><i class="fas fa-times"></i
            ></span>
          </p>
          <img
            [src]="
              banner.bannerImage.substring(
                banner.bannerImage.indexOf('assets')
              ) || 'assets/images/banner/banner1.jpg'
            "
            class="card-img"
            alt="Advertisement Image"
            [class.hidden]="banner.hidden"
          />
          <div class="card-img-overlay">
            <p class="why" *ngIf="banner.showWhyThisAd">
              Why This Ad?
              <span
                class="reverse-icon-wrapper"
                (click)="toggleBannerVisibility(banner)"
                ><i class="fas fa-undo reverse-icon"></i
              ></span>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="footer">
    <app-footer></app-footer>
  </div>
</section>
